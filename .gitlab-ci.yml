stages:
  - sync

branch_push:
  stage: sync
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - CU_ID=$(echo "$CI_COMMIT_BRANCH" | grep -oP '[a-z0-9]{9}')
    - echo "Extracted ClickUp task ID is $CU_ID"
    - python sync_clickup.py "$CU_ID" "in progress"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != "main"'

mr_opened:
  stage: sync
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - CU_ID=$(echo "$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME" | grep -oP '[a-z0-9]{9}')
    - echo "Extracted ClickUp task ID is $CU_ID"
    - python sync_clickup.py "$CU_ID" "review"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

merged_to_main:
  stage: sync
  image: python:3.11
  script:
    - pip install -r requirements.txt
    - CU_ID=$(echo "$CI_COMMIT_MESSAGE" | grep -oP '[a-z0-9]{9}' | head -1)
    - echo "Extracted ClickUp task ID is $CU_ID"
    - python sync_clickup.py "$CU_ID" "done"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "main"'